<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SafeTag FYDP Report</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0d0d0f; --card:#17171b; --line:#2c2c33; --text:#f2f2f2; --muted:#a3a3ad; --yel:#ffc20e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--text); font-family:Inter, Arial, sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:32px 28px; text-align:center; }
  img { width:56px; margin-bottom:16px; }
  h1 { font-size:22px; line-height:1.3; margin-bottom:6px; }
  p { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .btns { display:flex; gap:12px; }
  a { flex:1; display:block; padding:14px 0; border-radius:10px; font-weight:700; font-size:15px; text-decoration:none; }
  a.pdf { background:var(--yel); color:#111; }
  a.doc { border:1px solid var(--yel); color:var(--yel); }
  a:hover { opacity:.88; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="SafeTag">
    <h1>SafeTag FYDP Report</h1>
    <p>A Personal Safety Wearable Device and Intelligent Alert Platform</p>
    <div class="btns">
      <a class="pdf" href="/report/SafeTag-FYDP-Report.pdf" download>PDF</a>
      <a class="doc" href="/report/SafeTag-FYDP-Report.docx" download>Word</a>
    </div>
  </div>
</body>
</html>
